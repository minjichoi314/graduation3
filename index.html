<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나에게 주는 상</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&display=swap');
:root{--ink:#302c29;--gold:#f9c900;--warm:#fffdf8;--muted:#877e73}*{box-sizing:border-box}body{margin:0;background:#f4eee5;color:var(--ink);font-family:'Gowun Dodum',sans-serif}.shell{max-width:1180px;margin:0 auto;padding:32px 22px 52px}.top{text-align:center;margin-bottom:24px}.eyebrow{color:#aa7c21;font-size:13px;letter-spacing:.16em;font-weight:bold}.top h1{font-family:'Nanum Myeongjo',serif;font-size:clamp(27px,4vw,42px);margin:9px 0}.top p{margin:0;color:#766f67}.layout{display:grid;grid-template-columns:minmax(300px,410px) minmax(340px,1fr);gap:28px;align-items:start}.panel{background:#fff;border:1px solid #e8dfd2;border-radius:22px;padding:24px;box-shadow:0 12px 34px #54412512}.panel h2{font-size:19px;margin:0 0 18px}.field{margin:0 0 15px}.field label{display:block;font-size:13px;font-weight:bold;color:#5c554d;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid #e2dbd0;border-radius:11px;padding:11px 12px;background:#fffdf9;font:inherit;color:var(--ink);outline:none}.field input:focus,.field textarea:focus,.field select:focus{border-color:#dfb33d;box-shadow:0 0 0 3px #f7e8b6}.field textarea{min-height:95px;resize:vertical;line-height:1.6}.hint{font-size:12px;color:#958b7e;margin-top:5px}.reflect{background:#faf6ed;border-radius:14px;padding:15px;margin:2px 0 17px}.reflect h3{font-size:14px;margin:0 0 11px}.reflect label{display:block;font-size:12px;color:#6f6558;margin:8px 0 4px}.reflect select{border:1px solid #e5dac7;border-radius:9px;padding:8px;width:100%;font:inherit;background:white}.actions{display:flex;gap:10px}.btn{border:0;border-radius:12px;padding:13px 15px;font:inherit;font-weight:bold;cursor:pointer}.primary{background:#d59d26;color:white;flex:1}.secondary{background:#f2eee7;color:#5d554a}.preview-wrap{position:sticky;top:20px}.preview-title{display:flex;justify-content:space-between;align-items:center;margin:0 4px 11px;font-size:13px;color:#796f63}.certificate{position:relative;aspect-ratio:0.707;max-height:820px;width:100%;margin:auto;background:#fffefa;overflow:visible;box-shadow:0 16px 42px #39291626;display:flex;flex-direction:column;align-items:center;padding:9% 10% 7%;isolation:isolate;--frame-inset:clamp(14px,3.2vw,28px)}/* Gold double-rule frame */
.certificate:before{content:"";position:absolute;inset:var(--frame-inset);border:5px solid #e7b735;border-radius:26px;z-index:2;pointer-events:none}
.certificate:after{content:"";position:absolute;inset:calc(var(--frame-inset) + 12px);border:2px solid #e7b735;border-radius:14px;z-index:2;pointer-events:none}
.stars{display:flex;align-items:center;justify-content:center;gap:2.5%;width:88%;margin:2% auto 7%;height:12%;flex-shrink:0}.star{background:var(--gold);width:15%;aspect-ratio:1;clip-path:polygon(50% 0%,61% 35%,98% 38%,70% 61%,79% 99%,50% 77%,20% 99%,29% 61%,2% 38%,39% 35%)}.star:nth-child(1),.star:nth-child(5){transform:translateY(8px)}.star:nth-child(2),.star:nth-child(4){width:17%;transform:translateY(-3px)}.star:nth-child(3){width:21%;transform:translateY(-11px)}.cert-kicker{font-size:clamp(11px,1.6vw,18px);letter-spacing:.45em;color:#a07920;font-weight:bold;margin-top:0}.cert-title{font-family:'Nanum Myeongjo',serif;font-size:clamp(30px,6vw,68px);line-height:1.25;text-align:center;max-width:100%;overflow-wrap:anywhere;margin:1% 0 4%;font-weight:800}.cert-content{font-size:clamp(13px,2.1vw,23px);line-height:1.85;text-align:center;white-space:pre-line;max-width:95%;margin:1% 0;flex:1;display:flex;align-items:center;justify-content:center}.recipient{font-size:clamp(19px,3.2vw,34px);font-weight:bold;margin:1% 0 0}.recipient small{font-size:.55em;font-weight:normal}.footer{width:100%;display:grid;grid-template-columns:24% 1fr;gap:3%;align-items:end;margin-top:auto}.medal{width:100%;max-width:115px;aspect-ratio:1;position:relative;margin:0 auto 2%}.ribbon{position:absolute;left:20%;top:59%;width:60%;height:43%;background:linear-gradient(90deg,#168bd3,#33b8eb,#0871ba);clip-path:polygon(8% 0,92% 0,100% 100%,68% 80%,50% 100%,32% 80%,0 100%)}.medal-core{position:absolute;top:0;left:7%;width:86%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 33%,#ffdb55 0,#fa9d13 36%,#e67802 65%,#ba4c00 100%);border:7px dotted #ffb32c;box-shadow:0 0 0 3px #d97a0b, inset 0 0 0 3px #ffd64c;display:grid;place-items:center;color:#ffe168;text-shadow:0 1px 2px #a45000;font-size:19px}.sealstar{position:absolute;bottom:12%;font-size:10px;letter-spacing:2px}.date-receiver{text-align:center;padding-bottom:8%}.date{font-size:clamp(12px,2vw,21px);font-weight:bold;white-space:nowrap}.name-line{font-size:clamp(11px,1.8vw,18px);margin-top:10%;letter-spacing:.2em;color:#51493e}.stamp{font-size:clamp(8px,1.3vw,13px);color:#aaa;margin-top:4%}.export-note{text-align:center;color:#978c7c;font-size:12px;margin:11px 0 0}
@media(max-width:780px){.shell{padding:23px 14px}.layout{grid-template-columns:1fr;gap:22px}.preview-wrap{position:static;grid-row:1}.panel{padding:19px}.certificate{width:min(100%,480px)}.preview-title{max-width:480px;margin:0 auto 10px}}
@media print{body{background:white}.shell{padding:0}.top,.panel,.preview-title,.export-note{display:none!important}.layout{display:block}.preview-wrap{position:static}.certificate{box-shadow:none;width:100vw;height:141.4vw;max-height:none}}
</style></head>
<body><main class="shell">
<header class="top"><div class="eyebrow">A MOMENT TO CELEBRATE</div><h1>나에게 주는 상</h1><p>지난 3년의 나를 떠올리고, 잘해 온 나에게 특별한 상을 선물해요.</p></header>
<div class="layout"><section class="panel"><h2>나에게 주는 상</h2>
<div class="field"><label for="student">내 이름</label><input id="student" placeholder="예: 김해솔" maxlength="16"></div>
<div class="field"><label for="award">상 이름</label><input id="award" placeholder="예: 꾸준히 도전한 상" maxlength="22"></div>
<div class="field"><label for="message">상장 내용</label><textarea id="message" placeholder="예: 너는 낯선 일에도 한 걸음씩 도전하고, 힘든 순간에도 포기하지 않았기에 이 상을 수여합니다."></textarea><div class="hint">나의 노력과 성장, 기억에 남는 순간을 담아 보세요.</div></div>
<div class="field"><label for="to">이 상을 받고 싶은 사람</label><input id="to" placeholder="예: 늘 응원해 준 가족과 친구들" maxlength="36"></div>
<div class="reflect"><h3>3년의 나를 돌아보는 질문</h3>
<label for="memory">가장 기억에 남는 순간</label><select id="memory"><option value="">선택하거나 상장 내용에 직접 적기</option><option>새로운 일에 용기 내어 도전한 순간</option><option>친구와 함께 웃고 힘을 보탠 순간</option><option>어려움을 견디고 끝까지 해낸 순간</option><option>내가 좋아하는 것을 발견한 순간</option><option>실수에서 배우고 다시 시작한 순간</option><option>누군가에게 고맙다는 말을 들은 순간</option></select>
<label for="growth">내가 성장한 점</label><select id="growth"><option value="">선택하거나 상장 내용에 직접 적기</option><option>스스로 계획하고 실천하는 힘</option><option>다른 사람의 마음을 듣고 배려하는 마음</option><option>실패해도 다시 도전하는 용기</option><option>나의 생각을 표현하고 나누는 힘</option><option>나에게 맞는 방법을 찾아가는 힘</option><option>함께 협력하고 책임지는 태도</option></select>
</div><div class="actions"><button class="btn primary" id="save">상장 이미지 저장</button><button class="btn secondary" id="reset">다시 쓰기</button></div></section>
<section class="preview-wrap"><div class="preview-title"><span>상장 미리보기</span><span>작성 내용이 바로 반영돼요</span></div><article class="certificate" id="certificate"><div class="stars"><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i><i class="star"></i></div><div class="cert-title" id="pAward">상</div><div class="cert-content" id="pMessage">지난 3년 동안 나답게 배우고 성장하며<br>소중한 시간을 쌓아 온 나에게<br>이 상을 수여합니다.</div><div class="footer"><div class="medal"><div class="ribbon"></div><div class="medal-core">★<span class="sealstar">★ ★ ★</span></div></div><div class="date-receiver"><div class="date" id="pDate">2026년&nbsp;&nbsp;  월&nbsp;&nbsp; 일</div><div class="name-line" id="pTo">고마운 사람</div><div class="stamp">중학교 3년의 여정을 기념하며</div></div></div></article><div class="export-note">세로형 PNG 이미지로 저장됩니다.</div></section></div></main>
<script>
const $=id=>document.getElementById(id);const fields=['student','award','message','to'];
function update(){const student=$('student').value.trim();const award=$('award').value.trim();const msg=$('message').value.trim();const to=$('to').value.trim();$('pAward').textContent=award||'상';$('pMessage').textContent=msg||'지난 3년 동안 나답게 배우고 성장하며\n소중한 시간을 쌓아 온 나에게\n이 상을 수여합니다.';$('pTo').textContent=to||'고마운 사람';}
fields.forEach(id=>$(id).addEventListener('input',update));$('memory').addEventListener('change',e=>{if(e.target.value){const t=$('message');t.value+=(t.value?'\n':'')+'특히 '+e.target.value+'을(를) 기억하며, ';update();}});$('growth').addEventListener('change',e=>{if(e.target.value){const t=$('message');t.value+=(t.value?'\n':'')+'나는 '+e.target.value+'을(를) 키워 왔기에 이 상을 수여합니다.';update();}});
const pad=n=>String(n).padStart(2,'0');const today=new Date();$('pDate').innerHTML=`${today.getFullYear()}년&nbsp;&nbsp; ${today.getMonth()+1}월&nbsp;&nbsp; ${today.getDate()}일`;
function canvasRoundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.quadraticCurveTo(x,y,x,y+r);ctx.lineTo(x,y+h-r);ctx.quadraticCurveTo(x,y+h,x+r,y+h);ctx.lineTo(x+w-r,y+h);ctx.quadraticCurveTo(x+w,y+h,x+w,y+h-r);ctx.lineTo(x+w,y+r);ctx.quadraticCurveTo(x+w,y,x+w-r,y);ctx.closePath()}
function star(ctx,cx,cy,outer,inner,fill){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?inner:outer,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
function wrapText(ctx,text,maxWidth){const lines=[];for(const para of text.split('\n')){let line='';for(const char of para){if(ctx.measureText(line+char).width>maxWidth&&line){lines.push(line);line=char}else line+=char}lines.push(line)}return lines}
function drawCertificate(){const c=document.createElement('canvas'),W=1240,H=1754,ctx=c.getContext('2d');c.width=W;c.height=H;ctx.fillStyle='#fffefa';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#e7b735';ctx.lineWidth=10;ctx.beginPath();ctx.roundRect(58,58,W-116,H-116,46);ctx.stroke();ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(82,82,W-164,H-164,26);ctx.stroke();
for(let i=0;i<5;i++)star(ctx,220+i*200,210+[35,15,0,15,35][i],[60,73,91,73,60][i],[27,33,41,33,27][i],'#f9c900');
ctx.textAlign='center';let title=$('award').value.trim()||'상';ctx.fillStyle='#171513';ctx.font='bold 108px serif';let titleLines=wrapText(ctx,title,920);if(titleLines.length>2){ctx.font='bold 82px serif';titleLines=wrapText(ctx,title,920)}let ty=485;titleLines.forEach(line=>{ctx.fillText(line,W/2,ty);ty+=115});
let message=$('message').value.trim()||'지난 3년 동안 나답게 배우고 성장하며\n소중한 시간을 쌓아 온 나에게\n이 상을 수여합니다.';ctx.fillStyle='#302c29';ctx.font='38px sans-serif';let lines=wrapText(ctx,message,950);if(lines.length>8)ctx.font='32px sans-serif';const lh=62;let my=Math.max(ty+100,1010-(lines.length*lh)/2);lines.forEach(line=>{ctx.fillText(line,W/2,my);my+=lh});
// medal with ribbon
ctx.fillStyle='#168bd3';ctx.beginPath();ctx.moveTo(170,1530);ctx.lineTo(370,1530);ctx.lineTo(412,1690);ctx.lineTo(315,1635);ctx.lineTo(270,1700);ctx.lineTo(222,1635);ctx.lineTo(130,1690);ctx.closePath();ctx.fill();const grad=ctx.createRadialGradient(260,1470,20,270,1480,125);grad.addColorStop(0,'#ffdf68');grad.addColorStop(.5,'#f49a10');grad.addColorStop(1,'#b94b00');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(270,1480,115,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffb32c';ctx.lineWidth=17;ctx.setLineDash([4,7]);ctx.stroke();ctx.setLineDash([]);ctx.strokeStyle='#d97a0b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(270,1480,96,0,Math.PI*2);ctx.stroke();star(ctx,270,1480,45,20,'#ffe168');
ctx.textAlign='center';ctx.fillStyle='#171513';ctx.font='bold 39px sans-serif';ctx.fillText(`${today.getFullYear()}년   ${today.getMonth()+1}월   ${today.getDate()}일`,790,1510);ctx.fillStyle='#51493e';ctx.font='31px sans-serif';let to=$('to').value.trim()||'고마운 사람';ctx.fillText(to.length>23?to.slice(0,22)+'…':to,790,1600);ctx.fillStyle='#aaa';ctx.font='22px sans-serif';ctx.fillText('중학교 3년의 여정을 기념하며',790,1650);
const a=document.createElement('a');a.download='나에게_주는_상.png';a.href=c.toDataURL('image/png');a.click()}
$('save').addEventListener('click',drawCertificate);$('reset').addEventListener('click',()=>{fields.forEach(id=>$(id).value='');$('memory').selectedIndex=0;$('growth').selectedIndex=0;update()});update();
</script></body></html>
